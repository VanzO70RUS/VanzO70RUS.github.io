<!doctype html>
<html>
    <body>
    <form onsubmit="greet(); return false;">
        <input type="text" placeholder="Имя" id="name">
        <input type="submit">

        function greet()
        {
            alert("Hello " + document.querySelector("#name").value);
        }
    </script>
    </body>
</html>
